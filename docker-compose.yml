services:
  mysql:
    image: mysql:8.4
    container_name: mysql-polec
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: polec
      MYSQL_USER: polec
      MYSQL_PASSWORD: polec

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: