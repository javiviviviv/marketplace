

services:
  mysql-rol:
    image: mysql:8.4
    container_name: mysql-rol
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rol
      MYSQL_USER: rol_user
      MYSQL_PASSWORD: rol_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_rol_data:/var/lib/mysql

  mysql-usuario:
    image: mysql:8.4
    container_name: mysql-usuario
