spring.application.name=ms-usuario
server.port = 8081
#configuraciones de mi bbdd
spring.datasource.url=jdbc:mysql://localhost:3307/usuario?createDatabaseIfNotExist=true
spring.datasource.usuarioname = polec
spring.datasource.password = polec

#como quiero que se comporte mi bbdd cuando incie spring
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

#aca quiero asegurarme que si la tabla no existe, la cree
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#llamo o invoco al endpoint de rol
ms.role.url=http://localhost:8082