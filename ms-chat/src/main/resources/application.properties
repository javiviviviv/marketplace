spring.application.name=ms-chat
server.port = 8086

spring.datasource.url=jdbc:mysql://localhost:3312/chat?createDatabaseIfNotExist=true
spring.datasource.username = chat_user
spring.datasource.password = chat_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# endpoint del microservicio de usuarios para validar participantes
ms.usuario.url=http://localhost:8081
