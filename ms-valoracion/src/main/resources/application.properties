spring.application.name=ms-valoracion
server.port = 8088

spring.datasource.url=jdbc:mysql://localhost:3314/valoracion?createDatabaseIfNotExist=true
spring.datasource.username = valoracion_user
spring.datasource.password = valoracion_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# microservicios consultados para validar la reseña
ms.venta.url=http://localhost:8087
ms.item.url=http://localhost:8083
