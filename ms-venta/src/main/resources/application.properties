spring.application.name=ms-venta
server.port = 8087

spring.datasource.url=jdbc:mysql://localhost:3313/venta?createDatabaseIfNotExist=true
spring.datasource.username = venta_user
spring.datasource.password = venta_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# microservicios consultados para validar item y comprador
ms.item.url=http://localhost:8083
ms.usuario.url=http://localhost:8081
