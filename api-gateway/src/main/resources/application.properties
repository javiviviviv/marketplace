spring.application.name=api-gateway
server.port=8080

# Swagger UI centralizado: cada entrada apunta al OpenAPI de un microservicio
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

springdoc.swagger-ui.urls[0].name=Usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs/ms-usuario
springdoc.swagger-ui.urls[1].name=Roles
springdoc.swagger-ui.urls[1].url=/v3/api-docs/ms-rol
springdoc.swagger-ui.urls[2].name=Items
springdoc.swagger-ui.urls[2].url=/v3/api-docs/ms-item
springdoc.swagger-ui.urls[3].name=Categorias
springdoc.swagger-ui.urls[3].url=/v3/api-docs/ms-categoria
springdoc.swagger-ui.urls[4].name=Carrito
springdoc.swagger-ui.urls[4].url=/v3/api-docs/ms-carrito
springdoc.swagger-ui.urls[5].name=Chat
springdoc.swagger-ui.urls[5].url=/v3/api-docs/ms-chat
springdoc.swagger-ui.urls[6].name=Ventas
springdoc.swagger-ui.urls[6].url=/v3/api-docs/ms-venta
springdoc.swagger-ui.urls[7].name=Valoraciones
springdoc.swagger-ui.urls[7].url=/v3/api-docs/ms-valoracion
springdoc.swagger-ui.urls[8].name=Pagos
springdoc.swagger-ui.urls[8].url=/v3/api-docs/ms-pago
springdoc.swagger-ui.urls[9].name=Envios
springdoc.swagger-ui.urls[9].url=/v3/api-docs/ms-envio
