spring.application.name=ms-categoria

server.port = 8085

spring.datasource.url=jdbc:mysql://localhost:3310/categoria?createDatabaseIfNotExist=true
spring.datasource.username = categoria_user
spring.datasource.password = categoria_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

ms.categoria.url=http://localhost:8085