spring.application.name=ms-pago
server.port = 8089

spring.datasource.url=jdbc:mysql://localhost:3315/pago?createDatabaseIfNotExist=true
spring.datasource.username = pago_user
spring.datasource.password = pago_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
