spring.application.name=ms-envio
server.port = 8090

spring.datasource.url=jdbc:mysql://localhost:3316/envio?createDatabaseIfNotExist=true
spring.datasource.username = envio_user
spring.datasource.password = envio_pass

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

ms.usuario.url=http://localhost:8081
